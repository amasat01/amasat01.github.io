[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raptor-docs"
version = "0"
description = "Shared docs tooling for the RAPTOR family: Sphinx skin, notebook gates, freshness check, capability map"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["nbformat", "nbclient"]

[tool.setuptools]
packages = ["raptor_docs", "raptor_docs._static", "raptor_docs._static.fonts", "raptor_docs.nb", "raptor_docs.nb.hosted_env"]
include-package-data = true

[tool.setuptools.package-data]
"raptor_docs._static" = ["*.css"]
"raptor_docs._static.fonts" = ["*"]
"raptor_docs.nb.hosted_env" = ["*"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.ipynb"]

# a dev tool run under the docs interpreter, newer than the package floor
[tool.ruff.per-file-target-version]
"tools/generate_what_you_write_svg.py" = "py312"

[tool.ruff.lint]
select = ["F"]
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
# a line-count fixture standing in for eagle's card script: its blocks are counted, never run
"tests/fixtures/mini_eagle/benchmarks/perf_card/perf_card.py" = ["F821"]
