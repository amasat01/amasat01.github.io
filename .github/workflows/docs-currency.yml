#
# Read-only, once a day: the live documentation must show the newest release and serve a sitemap with lastmod.
# A red run here means the public pages are out of date (or a development version leaked): redeploy with docs.yml.

name: docs-currency

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: amasat01.github.io
        run: bash tools/docs_current_check.sh amasat01.github.io
      - name: raptor
        run: bash tools/docs_current_check.sh raptor
      - name: aether
        run: bash tools/docs_current_check.sh aether
      - name: eagle
        run: bash tools/docs_current_check.sh eagle
      - name: hawk
        run: bash tools/docs_current_check.sh hawk
