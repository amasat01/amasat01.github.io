#
# Build this Sphinx site and deploy it to GitHub Pages on push to main. This
# is the family's GitHub user site (https://amasat01.github.io/); each
# project repo (aether, raptor, eagle, hawk) deploys its own project site
# the same way from its own docs.yml.

name: Pages

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-fresh:
    # Freshness check, never a commit: the generator re-renders the pages and fails on any difference.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # companion eagle: same-named branch if it exists there, else main
      - id: ref_eagle
        env:
          COMPANION_REPO: eagle
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN:-none}" | base64 -w0)"
          [ -n "${GH_TOKEN:-}" ] || auth="X-Unauthenticated: 1"
          found="$(git -c http.extraHeader="$auth" ls-remote --heads "https://github.com/amasat01/${COMPANION_REPO}" "refs/heads/${BRANCH_NAME}" | awk '{print $2}')"
          if [ "$found" = "refs/heads/${BRANCH_NAME}" ]; then ref="$BRANCH_NAME"; else ref=main; fi
          echo "companion ${COMPANION_REPO} @ ${ref}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: amasat01/eagle
          ref: ${{ steps.ref_eagle.outputs.ref }}
          path: eagle
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: documented numbers match the committed cards
        run: |
          if ! python tools/sync_cards.py eagle && git diff --exit-code -I'"generated_utc"' -- _generated; then
            echo "::error::The documented performance numbers are out of date with the committed cards. Regenerate them locally with: python tools/sync_cards.py <path to an eagle checkout> -- then commit the result."
            exit 1
          fi
  build:
    needs: docs-fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -r requirements.txt
      - run: make strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
