#
# Build and check this Sphinx site on the pull request and store it under the
# git tree hash; deploy.yml publishes exactly that build on push to main. This
# is the family's GitHub user site (https://amasat01.github.io/); each project
# repo (aether, raptor, eagle, hawk) deploys its own project site the same way.

name: Pages

# Pull requests only: main receives the tested tree, nothing re-runs there.
on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-fresh:
    # Freshness check, never a commit: the generator re-renders the pages and fails on any difference.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # companion eagle: same-named branch if it exists there, else main
      - id: ref_eagle
        env:
          COMPANION_REPO: eagle
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN:-none}" | base64 -w0)"
          [ -n "${GH_TOKEN:-}" ] || auth="X-Unauthenticated: 1"
          found="$(git -c http.extraHeader="$auth" ls-remote --heads "https://github.com/amasat01/${COMPANION_REPO}" "refs/heads/${BRANCH_NAME}" | awk '{print $2}')"
          if [ "$found" = "refs/heads/${BRANCH_NAME}" ]; then ref="$BRANCH_NAME"; else ref=main; fi
          echo "companion ${COMPANION_REPO} @ ${ref}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: amasat01/eagle
          ref: ${{ steps.ref_eagle.outputs.ref }}
          path: eagle
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # the chart layout measures text with Pillow and DejaVu Sans (tools/visuals.py); without them it falls back to
      # an estimate and lays the charts out differently from the committed pages
      - name: text measuring for the chart layout
        run: |
          python -m pip install --quiet pillow==12.3.0
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || sudo apt-get install -y -q fonts-dejavu-core
      - name: regenerate the pages from the cards
        run: |
          if [ ! -d eagle/benchmarks ]; then
            echo "::error::generator or companion missing: eagle/benchmarks not found: check out the paired eagle branch into eagle"
            exit 4
          fi
          python tools/sync_cards.py eagle && rc=0 || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::generator usage error (rc 2): tools/sync_cards.py was called with bad arguments"
          elif [ "$rc" -ne 0 ]; then
            echo "::error::generator crashed (rc $rc): see the traceback above, a card the pages cite may be unreadable"
          fi
          exit "$rc"
      - name: generated pages match the committed ones
        run: |
          git diff --exit-code -I'"generated_utc"' -- _generated && rc=0 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::_generated out of date: regenerate with: python tools/sync_cards.py <eagle checkout>, then commit the result"
          fi
          exit "$rc"
  build:
    needs: docs-fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -r requirements.txt pyyaml
      - name: the deploy workflow only downloads, verifies and uploads
        run: python tools/ci_publish_subset.py .github/workflows/deploy.yml
      - run: make check
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ steps.tree.outputs.tree }}
          retention-days: 90
          path: _build/html
