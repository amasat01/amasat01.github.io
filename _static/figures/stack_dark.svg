<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%" role="img" aria-labelledby="stk-title-d stk-desc-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="stk-title-d">The four RAPTOR-family packages, top to bottom</title>
  <desc id="stk-desc-d">A stack. At the top, you write: a hawk kernel, in Python. Below it, eagle runs the kernel: launches, graphs and compaction, on CPU or GPU, and hawk kernels run through eagle. At the base sit the two foundations: aether, a header-only C++23 numerics core that eagle builds on, and raptor, the dependency-free contracts spine that both eagle and hawk declare. At the very bottom is the hardware everything ultimately runs on: CPU and GPUs.</desc>

  <rect x="0" y="0" width="400" height="500" fill="#1a1a19"/>

  <!-- caption: you write -->
  <text x="205" y="26" text-anchor="middle" font-size="12" font-style="italic" fill="#c3c2b7">you write</text>

  <!-- hawk -->
  <rect x="40" y="38" width="330" height="78" rx="14" fill="#edb94a" fill-opacity="0.22" stroke="#edb94a" stroke-width="2"/>
  <text x="56" y="66" font-size="15" font-weight="700" fill="#ffffff">hawk</text>
  <text x="56" y="86" font-size="12" fill="#c3c2b7">write a kernel once, in Python</text>
  <text x="56" y="102" font-size="12" fill="#c3c2b7">autodiff included</text>

  <!-- arrow: eagle -> hawk (hawk kernels run through eagle) -->
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <line x1="180" y1="173" x2="180" y2="122"/>
  </g>
  <path d="M 180 116 L 174 128 L 186 128 Z" fill="#ffffff"/>

  <!-- eagle -->
  <rect x="40" y="173" width="280" height="78" rx="14" fill="#ef7fa0" fill-opacity="0.22" stroke="#ef7fa0" stroke-width="2"/>
  <text x="56" y="201" font-size="15" font-weight="700" fill="#ffffff">eagle</text>
  <text x="56" y="221" font-size="12" fill="#c3c2b7">launches, graphs, compaction</text>
  <text x="56" y="237" font-size="12" fill="#c3c2b7">CPU and GPU</text>

  <!-- arrows: aether -> eagle, raptor -> eagle -->
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <line x1="110" y1="308" x2="110" y2="258"/>
    <line x1="260" y1="308" x2="260" y2="258"/>
  </g>
  <path d="M 110 252 L 104 264 L 116 264 Z" fill="#ffffff"/>
  <path d="M 260 252 L 254 264 L 266 264 Z" fill="#ffffff"/>

  <!-- arrow: raptor -> hawk (raptor is the spine both eagle and hawk declare), routed right of eagle -->
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <polyline points="332,308 348,308 348,122"/>
  </g>
  <path d="M 348 116 L 342 128 L 354 128 Z" fill="#ffffff"/>

  <!-- aether -->
  <rect x="40" y="308" width="140" height="68" rx="14" fill="#8fd3f7" fill-opacity="0.24" stroke="#8fd3f7" stroke-width="2"/>
  <text x="54" y="334" font-size="14" font-weight="700" fill="#ffffff">aether</text>
  <text x="54" y="352" font-size="12" fill="#c3c2b7">C++23 core</text>
  <text x="54" y="367" font-size="12" fill="#c3c2b7">header-only</text>

  <!-- raptor -->
  <rect x="190" y="308" width="140" height="68" rx="14" fill="#a88bf0" fill-opacity="0.24" stroke="#a88bf0" stroke-width="2"/>
  <text x="204" y="334" font-size="14" font-weight="700" fill="#ffffff">raptor</text>
  <text x="204" y="352" font-size="12" fill="#c3c2b7">contracts, zero</text>
  <text x="204" y="367" font-size="12" fill="#c3c2b7">dependencies</text>

  <!-- arrow: eagle runs on hardware (execution, not a package dependency: shown dashed) -->
  <g stroke="#898781" stroke-width="2" fill="none" stroke-dasharray="4 4">
    <line x1="180" y1="251" x2="180" y2="395"/>
  </g>
  <path d="M 180 401 L 174 389 L 186 389 Z" fill="#898781"/>

  <!-- caption: it runs on -->
  <text x="200" y="420" text-anchor="middle" font-size="12" font-style="italic" fill="#c3c2b7">it runs on</text>

  <!-- hardware band -->
  <rect x="40" y="430" width="320" height="56" rx="14" fill="#2c2c2a" fill-opacity="0.7" stroke="#3a3a37" stroke-width="1.5"/>
  <g>
    <rect x="88" y="446" width="26" height="24" rx="3" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <line x1="94" y1="446" x2="94" y2="440" stroke="#ffffff" stroke-width="1.6"/>
    <line x1="108" y1="446" x2="108" y2="440" stroke="#ffffff" stroke-width="1.6"/>
    <line x1="94" y1="470" x2="94" y2="476" stroke="#ffffff" stroke-width="1.6"/>
    <line x1="108" y1="470" x2="108" y2="476" stroke="#ffffff" stroke-width="1.6"/>
    <text x="101" y="494" text-anchor="middle" font-size="12" fill="#ffffff">CPU</text>
  </g>
  <g>
    <rect x="266" y="446" width="46" height="24" rx="4" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <line x1="266" y1="452" x2="312" y2="452" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="266" y1="458" x2="312" y2="458" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="266" y1="464" x2="312" y2="464" stroke="#ffffff" stroke-width="1.2"/>
    <text x="289" y="494" text-anchor="middle" font-size="12" fill="#ffffff">GPUs</text>
  </g>
</svg>
