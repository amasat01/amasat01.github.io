<text x="370.0" y="108" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="370.0" fill="#5c35cc" font-weight="700">@hawk.kernel</tspan></text>
<text x="370.0" y="124" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="370.0" fill="#204a87" font-weight="700">def</tspan><tspan fill="#0b0b0b"> oscillator</tspan><tspan fill="#0b0b0b">(x, v, terminated, ...):</tspan></text>
<text x="398.8" y="140" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="398.8" fill="#8f5902" font-style="italic"># the step's math</tspan></text>
<text x="398.8" y="156" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="398.8" fill="#0b0b0b">x, v = x + dt*v, v - dt*w*w*x</tspan></text>
<text x="398.8" y="172" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="398.8" fill="#0b0b0b">t += dt</tspan></text>
<text x="398.8" y="188" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="398.8" fill="#0b0b0b">terminated = t &gt;= t_end</tspan></text>
<text x="370.0" y="204" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="370.0" fill="#8f5902" font-style="italic"># run the batch:</tspan></text>
<text x="370.0" y="220" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="370.0" fill="#0b0b0b">eagle</tspan><tspan fill="#0b0b0b">.</tspan><tspan fill="#0b0b0b">simulate</tspan><tspan fill="#0b0b0b">(oscillator, w=w,</tspan></text>
<text x="398.8" y="236" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="398.8" fill="#0b0b0b">t_end=1.0, x=x, v=v, max_steps=S)</tspan></text>
<text x="360" y="263" font-size="12" font-style="italic" fill="#52514e">oscillator + eagle.simulate, from the quickstart</text>
