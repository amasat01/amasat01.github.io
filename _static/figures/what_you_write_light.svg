<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 570" width="100%" height="100%" role="img" aria-labelledby="wyw-title wyw-desc" xml:space="preserve" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="wyw-title">What you write: Warp's thread program next to a RAPTOR (hawk) kernel</title>
<desc id="wyw-desc">Two side-by-side columns for the same batch-of-trajectories task, each sample stopping at its own time. Left, Warp: you write the thread program -- a tiny wp.kernel with a per-thread while-loop and its own exit test, launched once over all threads. Right, RAPTOR: you write one step of one sample -- a tiny hawk.kernel that writes the per-sample math as plain local variables and sets its own terminated flag; eagle.simulate drives the repeated launches. Below each code sketch, a list of six run-time decisions -- the per-sample loop and exit, launch timing, compaction and reorder, graph capture, running on CPU and GPU, and derivatives -- each tagged 'you' when the author writes it explicitly (true of every item in Warp's column, framed as control) or 'engine' when eagle decides it at run time (true for launch timing, compaction, graph capture, CPU/GPU dispatch and generating derivatives in RAPTOR's column). Warp and RAPTOR both differentiate their kernels, Warp by recording a wp.Tape, RAPTOR by deriving forward- and backward-mode kernels from the same source. Code sketches are syntax-coloured to match this site's own code blocks.</desc>
<rect x="0" y="0" width="700" height="570" fill="#fcfcfb"/>
<text x="350.0" y="16" text-anchor="middle" font-size="12" font-style="italic" fill="#52514e">same task: a batch of trajectories, each sample stopping at its own time</text>
<text x="180.0" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">Warp</text>
<text x="180.0" y="55" text-anchor="middle" font-size="12" fill="#52514e">you write the thread program</text>
<rect x="20" y="61" width="320" height="3" fill="#9a6a00"/>
<text x="20" y="81" font-size="12" font-weight="600" fill="#0b0b0b">what you write</text>
<rect x="20" y="89" width="320" height="160" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
<text x="30.0" y="108" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="30.0" fill="#5c35cc" font-weight="700">@wp.kernel</tspan></text>
<text x="30.0" y="124" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="30.0" fill="#204a87" font-weight="700">def</tspan><tspan fill="#0b0b0b"> oscillators</tspan><tspan fill="#0b0b0b">(x, v, k, ...):</tspan></text>
<text x="58.8" y="140" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="58.8" fill="#0b0b0b">i = wp</tspan><tspan fill="#0b0b0b">.</tspan><tspan fill="#0b0b0b">tid</tspan><tspan fill="#0b0b0b">()</tspan></text>
<text x="58.8" y="156" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="58.8" fill="#204a87" font-weight="700">while</tspan><tspan fill="#0b0b0b"> ks &lt; ns:</tspan></text>
<text x="87.6" y="172" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="87.6" fill="#8f5902" font-style="italic"># ...RK4 math on xs, vs...</tspan></text>
<text x="87.6" y="188" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="87.6" fill="#0b0b0b">ks += wp</tspan><tspan fill="#0b0b0b">.</tspan><tspan fill="#0b0b0b">float64</tspan><tspan fill="#0b0b0b">(</tspan><tspan fill="#0000cf" font-weight="700">1.0</tspan><tspan fill="#0b0b0b">)</tspan></text>
<text x="30.0" y="204" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="30.0" fill="#8f5902" font-style="italic"># run the batch:</tspan></text>
<text x="30.0" y="220" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="30.0" fill="#0b0b0b">wp</tspan><tspan fill="#0b0b0b">.</tspan><tspan fill="#0b0b0b">launch</tspan><tspan fill="#0b0b0b">(oscillators, dim=n, ...)</tspan></text>
<text x="20" y="263" font-size="12" font-style="italic" fill="#52514e">warp_kernel, condensed from eagle's perf_card.py</text>
<text x="20" y="288" font-size="12" font-weight="600" fill="#0b0b0b">who decides</text>
